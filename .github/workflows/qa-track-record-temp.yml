name: Temporary Track Record QA

on:
  push:
    branches:
      - fix/nhl-season-label-fallback-20260920

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test tests/preseason-rehearsal.test.mjs
      - run: node tests/pbe-picks.test.mjs
      - run: npm run build
