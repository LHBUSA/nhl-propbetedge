name: Temporary NHL Live Cast QA

on:
  push:
    branches:
      - fix/nhl-cast-live-entry-20260920

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Live Cast entry regression
        run: node --test tests/live-cast-entry.test.mjs
      - name: Syntax checks
        run: |
          node --check src/pages/cast.js
          node --check src/pages/cast-center.js
          node --check src/components/replay.js
      - name: Production build
        run: npm run build
