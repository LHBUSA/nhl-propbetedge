name: NHL Frontend CI

on:
  push:
    branches: [main, nhl-product-v1, nhl-ufc2-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Proxy allowlist + truth-rule checks
        run: node tests/frontend-checks.mjs
      - run: npm run build
