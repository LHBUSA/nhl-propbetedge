  <script>
    (function () {
      var GA_ID = 'G-BRS48R8PG9';
      var SURFACE = 'nhl';
      var HASH_ROUTES = true;
      var host = String(location.hostname || '').toLowerCase();
      var isProd = host === 'propbetedge.ai' || host.endsWith('.propbetedge.ai');
      if (!isProd || host.endsWith('.vercel.app') || host.endsWith('.workers.dev') || host.endsWith('.pages.dev') || host === 'localhost' || host === '127.0.0.1') return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('set', { pbe_surface: SURFACE });
      window.gtag('config', GA_ID, {
        cookie_domain: '.propbetedge.ai',
        cookie_flags: 'SameSite=Lax;Secure'
      });

      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
      document.head.appendChild(tag);

      // GA4 Enhanced Measurement owns normal page loads and browser-history
      // page views. Hash-router surfaces need one supplement because their
      // primary route changes do not necessarily call pushState/replaceState.
      var lastManualHash = '';
      var lastPopStateAt = 0;
      addEventListener('popstate', function () { lastPopStateAt = Date.now(); });
      if (HASH_ROUTES) {
        addEventListener('hashchange', function () {
          // Back/forward can emit popstate + hashchange. Let GA4 own popstate.
          if (Date.now() - lastPopStateAt < 250) return;
          var currentHash = location.hash || '#/';
          if (currentHash === lastManualHash) return;
          lastManualHash = currentHash;
          window.gtag('event', 'page_view', {
            page_title: document.title,
            page_location: location.href,
            page_path: location.pathname + location.search + currentHash,
            pbe_surface: SURFACE,
            pbe_route_type: 'hash'
          });
        });
      }

      document.addEventListener('click', function (event) {
        var target = event.target && event.target.closest ? event.target.closest('a[href]') : null;
        if (!target) return;
        try {
          var url = new URL(target.href, location.href);
          if (url.hostname !== host && (url.hostname === 'propbetedge.ai' || url.hostname.endsWith('.propbetedge.ai'))) {
            window.gtag('event', 'pbe_network_click', {
              pbe_surface: SURFACE,
              source_host: host,
              target_host: url.hostname,
              link_url: url.href
            });
          }
        } catch (_) {}
      }, { capture: true });
    })();
  </script>

    <script>
      // Preload the one image that paints first on the landing route: the
      // Ice Board hero, or that page's photo backdrop (same size rule as
      // src/lib/backdrops.js — keep the two in step). Nothing else is preloaded.
      (function () {
        var h = location.hash;
        var seg = h.replace(/^#\/?/, '').split(/[/?]/)[0];
        var BD = { cast: 'cast', props: 'props', goalies: 'goalies', lines: 'lines', injuries: 'injuries', news: 'news', matchup: 'matchups', players: 'players', player: 'players', standings: 'standings', team: 'standings' };
        if (seg) {
          var key = BD[seg];
          if (!key) return;
          var vw = window.innerWidth, need = Math.min(vw * (window.devicePixelRatio || 1), 2000);
          var size = vw <= 700 ? 'm-700' : need <= 800 ? '800' : need <= 1400 ? '1400' : '2000';
          var b = document.createElement('link');
          b.rel = 'preload'; b.as = 'image'; b.type = 'image/avif'; b.fetchPriority = 'high';
          b.href = '/assets/nhl/backdrops/' + key + '-' + size + '.avif';
          document.head.appendChild(b);
          return;
        }
        var mobile = window.matchMedia('(max-width: 600px)').matches;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif'; l.fetchPriority = 'high';
        l.setAttribute('imagesrcset', mobile
          ? '/assets/nhl/hero-ice-m-600.avif 600w, /assets/nhl/hero-ice-m-900.avif 900w'
          : '/assets/nhl/hero-ice-960.avif 960w, /assets/nhl/hero-ice-1440.avif 1440w, /assets/nhl/hero-ice-1920.avif 1920w, /assets/nhl/hero-ice-2560.avif 2560w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      })();
    </script>
