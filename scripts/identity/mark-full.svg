<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PropBetEdge NHL: a P drawn as a hockey stick. Shaft = stem,
       heel + blade on the ice, gold on near-black. Our own mark; no league marks. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="74%">
      <stop offset="0" stop-color="#2a2318"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="120" y1="80" x2="400" y2="440">
      <stop offset="0" stop-color="#f5e08e"/>
      <stop offset=".45" stop-color="#d9b441"/>
      <stop offset="1" stop-color="#9a7719"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" x2="1">
      <stop offset="0" stop-color="#cfe6f5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e6f2fa" stop-opacity=".85"/>
      <stop offset="1" stop-color="#cfe6f5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#d4af37" stroke-opacity=".32" stroke-width="5"/>
  <g transform="translate(264 256) scale(0.9) skewX(-10) translate(-256 -256)">
    <path fill="url(#gold)" fill-rule="evenodd" d="M226 94 Q226 84 236 84 H336 A114 114 0 0 1 336 312 H310 V360 A64 64 0 0 1 246 424 H98 Q64 424 64 398 Q64 374 96 370 L204 366 Q226 365 226 342 Z M310 150 H336 A48 48 0 0 1 336 246 H310 Z"/>
    <rect x="40" y="440" width="430" height="7" rx="3.5" fill="url(#ice)"/>
  </g>
</svg>
